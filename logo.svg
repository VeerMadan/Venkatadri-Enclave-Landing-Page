<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="mvkGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Monogram Emblem -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield/Diamond -->
    <path d="M 40 5 L 75 40 L 40 75 L 5 40 Z" stroke="url(#mvkGoldGrad)" stroke-width="2.5" fill="none" opacity="0.85"/>
    <circle cx="40" cy="40" r="28" stroke="url(#mvkGoldGrad)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
    
    <!-- Stylized Architectural 'M' and Crown -->
    <path d="M 24 55 L 24 30 L 40 46 L 56 30 L 56 55" stroke="url(#mvkGoldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="40,20 44,27 36,27" fill="url(#mvkGoldGrad)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(105, 0)">
    <text x="0" y="44" font-family="'Cinzel', 'Playfair Display', serif" font-size="28" font-weight="800" fill="url(#mvkGoldGrad)" letter-spacing="3">VENKATADRI</text>
    <text x="180" y="44" font-family="'Cinzel', 'Playfair Display', serif" font-size="28" font-weight="400" fill="#F59E0B" letter-spacing="3">ENCLAVE</text>
    
    <text x="2" y="66" font-family="'Outfit', sans-serif" font-size="9.5" font-weight="600" fill="#94A3B8" letter-spacing="4">BY MVK BUILDERS &amp; DEVELOPERS LLP</text>
    <line x1="2" y1="74" x2="295" y2="74" stroke="url(#mvkGoldGrad)" stroke-width="0.75" opacity="0.4"/>
    <text x="2" y="86" font-family="'Outfit', sans-serif" font-size="8" font-weight="500" fill="#F59E0B" letter-spacing="2">HPA &amp; BMRDA APPROVED • BAGALURU RD, YELAHANKA</text>
  </g>
</svg>
